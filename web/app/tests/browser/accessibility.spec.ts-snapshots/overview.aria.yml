- main:
  - heading "Overview" [level=1]
  - group "Date range":
    - button "Today"
    - button "7 days"
    - button /\d+ days/ [pressed]
    - button "This month"
    - button "All time"
  - 'button "Agent: All agents"'
  - 'button "Project: All projects"'
  - 'button "Model: All models"'
  - button "Export"
  - region "Plan limits":
    - heading "Plan limits" [level=2]
    - region "Claude Code's plan limits":
      - heading "Claude Code" [level=3]
      - text: /Official · status line · 2 min ago Five-hour window \d+%/
      - meter /Five-hour window, \d+% used/
      - text: /Resets \d+:\d+, in 2 h \d+ min Weekly, all models \d+%/
      - meter /Weekly window, \d+% used/
      - text: /Over \d+% Resets Thu \d+ Oct, \d+:\d+ Weekly, Fable \d+%/
      - meter /Weekly Fable window, \d+% used/
      - text: /Resets Thu \d+ Oct, \d+:\d+/
    - region "Copilot's plan limits":
      - heading "Copilot" [level=3]
      - text: Recorded · Copilot · 1 h ago Monthly allowance 4%
      - meter "Copilot's monthly allowance, 4% used"
      - text: /\d+,\d+ of \d+,\d+ AI credits Resets Sun 1 Nov, \d+:\d+/
      - paragraph: The allowance counts Copilot wherever you use it, and updates while Copilot runs.
  - region "Today":
    - heading "Today" [level=2]
    - text: /Includes estimate \$\d+\.\d+ [\d,.]+[bkmBKM]+ tokens · −\d+% on yesterday/
    - 'img /Daily cost over the last \d+ days: lowest \$\d+\.\d+, highest \$\d+\.\d+, last \$\d+\.\d+/'
    - term: Claude Code
    - definition: /\$\d+\.\d+ estimate/
    - term: Copilot CLI
    - definition: /\$\d+\.\d+ recorded · \d+ credits/
    - term: Copilot in VS Code
    - definition: /\$\d+\.\d+ recorded · 0 credits/
  - region "This week":
    - heading "This week" [level=2]
    - text: /Includes estimate \$\d+\.\d+ [\d,.]+[bkmBKM]+ tokens · \+\d+% on last week/
    - 'img /Daily cost over the last \d+ days: lowest \$\d+\.\d+, highest \$\d+\.\d+, last \$\d+\.\d+/'
    - term: Claude Code
    - definition: /\$\d+\.\d+ estimate/
    - term: Copilot CLI
    - definition: /\$\d+\.\d+ recorded · \d+,\d+ credits/
    - term: Copilot in VS Code
    - definition: /\$\d+\.\d+ recorded · \d+ credits/
  - region "This month":
    - heading "This month" [level=2]
    - text: /Includes estimate \$\d+\.\d+ [\d,.]+[bkmBKM]+ tokens · month to date/
