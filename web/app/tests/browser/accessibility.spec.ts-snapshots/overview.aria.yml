    - definition: /\$\d+\.\d+ estimate/
    - term: Copilot CLI
    - definition: /\$\d+\.\d+ recorded · \d+,\d+ credits/
    - term: Copilot in VS Code
    - definition: /\$\d+\.\d+ recorded · \d+ credits/
  - region "Cost per day":
    - heading "Cost per day" [level=2]
    - text: /Includes an estimate at Anthropic's list prices · last \d+ days/
    - button "Show as table"
    - list "Legend":
      - listitem: /Claude Code , \$\d+\.\d+/
      - listitem: /Copilot CLI , \$\d+\.\d+/
      - listitem: /Copilot in VS Code , \$\d+\.\d+/
    - 'group /Cost per day by agent, last \d+ days: \$\d+\.\d+ in all, highest \$\d+\.\d+ on Thu 8 Oct\. The left and right arrow keys read each column\./'
  - region "Top projects":
    - heading "Top projects" [level=2]
    - text: /Cost · last \d+ days/
    - region "Claude Code's top projects":
      - heading "Claude Code" [level=3]
      - list:
        - listitem: /agent-dashboard , \$\d+\.\d+/
        - listitem: /api-gateway , \$\d+\.\d+/
        - listitem: /website , \$\d+\.\d+/
        - listitem: /Other projects , \$\d+\.\d+/
    - region "Copilot CLI's top projects":
      - heading "Copilot CLI" [level=3]
      - list:
        - listitem: /infra , \$\d+\.\d+/
        - listitem: /walkthrough , \$\d+\.\d+/
        - listitem: /agent-dashboard , \$\d+\.\d+/
        - listitem: /Other projects , \$\d+\.\d+/
